<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テトリス風ゲーム (Gemini生成)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #202028;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #game-container {
            display: flex;
            gap: 20px;
            border: 4px solid #fff;
            border-radius: 10px;
            padding: 20px;
            background-color: #101015;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        #tetris-canvas {
            border: 2px solid #555;
            background-color: #000;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 150px;
        }

        .info-block {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.9em;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        #controls {
            margin-top: 15px;
            font-size: 0.85em;
            line-height: 1.4;
            color: #ccc;
        }

        #start-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #start-button:hover {
            background-color: #45a049;
        }

        #start-button:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <h1>TETRIS-LIKE</h1>

    <div id="game-container">
        <!-- ゲーム画面 -->
        <canvas id="tetris-canvas" width="240" height="400"></canvas>

        <!-- 情報パネル -->
        <div id="info-panel">
            <div class="info-block">
                <div class="info-label">SCORE</div>
                <div id="score" class="info-value">0</div>
            </div>

            <div class="info-block">
                <div class="info-label">LINES</div>
                <div id="lines" class="info-value">0</div>
            </div>

            <div id="controls">
                <p><strong>【操作】</strong></p>
                <p>← / → : 移動</p>
                <p>↑ : 回転</p>
                <p>↓ : 落下(早)</p>
            </div>

            <button id="start-button">ゲーム開始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris-canvas');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const linesElement = document.getElementById('lines');
        const startButton = document.getElementById('start-button');

        // ブロックの解像度（1ブロックあたりのピクセル数）
        context.scale(20, 20);

        // テトリミノ（ブロック）の定義
        const pieces = {
            'I': [[1, 1, 1, 1]],
            'L': [[0, 0, 1], [1, 1, 1], [0, 0, 0]],
            'J': [[1, 0, 0], [1, 1, 1], [0, 0, 0]],
            'O': [[1, 1], [1, 1]],
            'Z': [[1, 1, 0], [0, 1, 1], [0, 0, 0]],
            'S': [[0, 1, 1], [1, 1, 0], [0, 0, 0]],
            'T': [[0, 1, 0], [1, 1, 1], [0, 0, 0]]
        };

        const colors = {
            'I': '#00f0f0',
            'L': '#f0a000',
            'J': '#0000f0',
            'O': '#f0f000',
            'Z': '#f00000',
            'S': '#00f000',
            'T': '#a000f0'
        };

        // ボードの設定
        const ROWS = 20;
        const COLS = 12;
        let board = createMatrix(COLS, ROWS);

        // プレイヤーの状態
        let player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
            lines: 0,
            type: ''
        };

        // ゲームループの管理
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let gameActive = false;

        // ボード（2次元配列）を作成
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // 衝突判定
        function collide(board, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 描画処理
        function drawMatrix(matrix, offset, color = null) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = color || value; // 色を指定するか、値そのものを使う
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(board, { x: 0, y: 0 }); // 固定されたブロックを描画
            if (player.matrix) {
                drawMatrix(player.matrix, player.pos, colors[player.type]); // 落下中のブロックを描画
            }
        }

        // 落下処理
        function playerDrop() {
            if (!gameActive) return;
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        // 固定されたブロックをボードにマージ
        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + player.pos.y][x + player.pos.x] = colors[player.type]; // 色を保存
                    }
                });
            });
        }

        // ブロックの回転
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            // 回転時の衝突回避
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir); // 回転を戻す
                    player.pos.x = pos;
                    return;
                }
            }
        }

        // 移動処理
        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(board, player)) {
                player.pos.x -= offset;
            }
        }

        // 新しいブロックを生成
        function playerReset() {
            const types = 'ILJOTSZ';
            player.type = types[types.length * Math.random() | 0];
            player.matrix = pieces[player.type];
            player.pos.y = 0;
            player.pos.x = (board[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(board, player)) {
                gameOver();
            }
        }

        // ライン消去
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = board.length -1; y > 0; --y) {
                for (let x = 0; x < board[y].length; ++x) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }
                // ラインが揃った
                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                ++y;
                player.score += rowCount * 10;
                player.lines++;
                rowCount *= 2; // 連鎖でスコアアップ
            }
        }

        // スコアとラインの更新
        function updateScore() {
            scoreElement.innerText = player.score;
            linesElement.innerText = player.lines;
        }

        // ゲームループ
        function update(time = 0) {
            if (!gameActive) return;
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // ゲーム開始
        function startGame() {
            board.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            updateScore();
            playerReset();
            gameActive = true;
            startButton.style.display = 'none';
            update();
        }

        // ゲームオーバー
        function gameOver() {
            gameActive = false;
            context.fillStyle = 'rgba(0,0,0,0.75)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = '#f00';
            context.font = '2px Arial';
            context.textAlign = 'center';
            context.fillText('GAME OVER', board[0].length / 2, board.length / 2);
            startButton.innerText = 'リトライ';
            startButton.style.display = 'block';
        }

        // キーボード操作
        document.addEventListener('keydown', event => {
            if (!gameActive) return;
            if (event.keyCode === 37) { // 左矢印
                playerMove(-1);
            } else if (event.keyCode === 39) { // 右矢印
                playerMove(1);
            } else if (event.keyCode === 40) { // 下矢印
                playerDrop();
            } else if (event.keyCode === 38) { // 上矢印（回転）
                playerRotate(1);
            }
        });

        startButton.addEventListener('click', startGame);

        // 最初の描画
        draw();
    </script>
</body>
</html>
